<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <clipPath id="cp">
      <circle cx="90" cy="100" r="60"/>
    </clipPath>
    <mask id="m">
      <rect x="160" y="40" width="120" height="120" fill="white"/>
      <circle cx="220" cy="100" r="30" fill="black"/>
    </mask>
  </defs>
  <g clip-path="url(#cp)">
    <rect x="20" y="40" width="150" height="120" fill="#c17d11"/>
    <rect x="60" y="80" width="150" height="60" fill="#729fcf"/>
  </g>
  <rect x="170" y="50" width="100" height="100" fill="#5c3566" mask="url(#m)"/>
</svg>
