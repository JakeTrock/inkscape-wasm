<!DOCTYPE html>
<html>
<head>
<meta charset="utf8">
<title>Inkscape WASM</title>
<style type="text/css">
  html, body { margin: 0; height: 100%; overflow: hidden;
               display: flex; flex-direction: column; }
  #toolbar { display: flex; gap: 8px; align-items: center; padding: 4px 8px;
             background: #eee; font: 13px sans-serif; flex: none;
             position: relative; z-index: 10; }
  #toolbar button { padding: 3px 10px; }
  #status { margin-left: auto; color: #555; max-width: 40em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stagebar { display: flex; gap: 12px; padding: 2px 8px; background: #f8f8f8;
              font: 12px sans-serif; color: #999; flex: none;
              position: relative; z-index: 10; }
  .stage[data-state="ok"] { color: #080; }
  .stage[data-state="fail"] { color: #c00; font-weight: bold; }
  #broadway { flex: 1; overflow: hidden; position: relative;
              background: #404040; }
  #console { flex: none; height: 120px; overflow-y: scroll; background: #111;
             color: #ccc; font: 11px monospace; padding: 4px 8px;
             white-space: pre-wrap; position: relative; z-index: 10; }
  #console .err { color: #f66; }
  /* broadway.js appends absolutely-positioned canvases to body — keep them
   * under the harness chrome */
  body > canvas { z-index: 1; }
</style>
<script type="text/javascript" src="inkscape.js"></script>
<script type="text/javascript" src="rawinflate.min.js"></script>
<script type="text/javascript" src="bridge.js"></script>
<script type="text/javascript" src="broadway.js"></script>
</head>
<body>
<div id="toolbar">
  <button id="btn-open">Open SVG</button>
  <button id="btn-save">Save</button>
  <button id="btn-export">Export PNG</button>
  <button id="btn-reload">Hard reload</button>
  <span id="status">booting…</span>
  <input id="file-input" type="file" accept=".svg" hidden>
</div>
<div id="stagebar">
  <span class="stage" id="stage-module">module fetched</span>
  <span class="stage" id="stage-runtime">runtime ready</span>
  <span class="stage" id="stage-broadway">broadway connected</span>
  <span class="stage" id="stage-window">window up</span>
  <span class="stage" id="stage-frame">first frame</span>
</div>
<div id="broadway"></div>
<div id="console"></div>
<script type="module" src="loader.js"></script>
</body>
</html>
