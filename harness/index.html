<!DOCTYPE html>
<html>
<head>
<meta charset="utf8">
<title>Inkscape WASM</title>
<style type="text/css">
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
               background: #2b2b2b; }
  body > canvas { z-index: 1; margin: 0; }
</style>
<script type="text/javascript" src="inkscape.js"></script>
<script type="text/javascript" src="rawinflate.min.js"></script>
<script type="text/javascript" src="bridge.js"></script>
<script type="text/javascript" src="broadway.js"></script>
</head>
<body>
<div style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden">
  <button id="btn-open">Open SVG</button>
  <button id="btn-save">Save</button>
  <button id="btn-export">Export PNG</button>
  <button id="btn-reload">Hard reload</button>
  <span id="status">booting…</span>
  <input id="file-input" type="file" accept=".svg,.png,.jpg,.jpeg,.webp,.gif,.bmp,image/*" multiple hidden>
  <span class="stage" id="stage-module">·</span>
  <span class="stage" id="stage-runtime">·</span>
  <span class="stage" id="stage-broadway">·</span>
  <span class="stage" id="stage-window">·</span>
  <span class="stage" id="stage-frame">·</span>
  <div id="broadway"></div>
  <div id="console"></div>
</div>
<script type="module" src="loader.js"></script>
</body>
</html>
